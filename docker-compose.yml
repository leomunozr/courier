version: '3.8'

services:
  # Base de datos PostgreSQL (Lista para Producción)
  # Actualmente el backend usa SQLite para desarrollo ágil,
  # pero puedes habilitar Postgres descomentando este servicio y
  # cambiando provider="sqlite" a "postgresql" en schema.prisma.
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: courier_postgres
  #   environment:
  #     POSTGRES_USER: admin
  #     POSTGRES_PASSWORD: password123
  #     POSTGRES_DB: courier_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

  # Caché de alta velocidad para Tracking
  redis:
    image: redis:7-alpine
    container_name: courier_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Almacenamiento S3 Compatible para Documentos (SHA-256)
  minio:
    image: minio/minio:latest
    container_name: courier_minio
    environment:
      MINIO_ROOT_USER: admin_minio
      MINIO_ROOT_PASSWORD: password_minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  # postgres_data:
  minio_data: